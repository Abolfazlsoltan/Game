name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          cache: true

      - name: Install Android packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip flet

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK (retry transient Maven rate limits)
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            echo "APK build attempt $attempt/4"
            if flet build apk --verbose; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              wait_seconds=$((attempt * 30))
              echo "Build failed; waiting ${wait_seconds}s before retrying in case Maven Central is rate-limiting requests."
              sleep "$wait_seconds"
            fi
          done
          echo "APK build failed after 4 attempts."
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: road-racer-apk
          path: |
            build/apk/*.apk
            build/**/*.apk
          if-no-files-found: error
          retention-days: 14
